x-patroni-common: &patroni-common
  build:
    context: .
    dockerfile: ./patroni/Dockerfile.patroni
  networks:
    - infra
  environment:
    PATRONI_SCOPE: app_cluster
    POSTGRES_PASSWORD: app_pswd
    POSTGRES_DB: app_db
  depends_on:
    etcd:
      condition: service_healthy

x-app-common: &app-common
  build:
    context: ..
    dockerfile: Dockerfile
    target: dev
  restart: always
  environment:
    ALLOW_ORIGINS: "http://localhost:3030,http://0.0.0.0:3030,http://localhost:8000"
    DB_MASTER_HOST: haproxy
    DB_REPLICAS: "haproxy:5433"
    REDIS_HOST: redis
    KAFKA_BROKERS: kafka:9093
  env_file:
    - ../dev.env
  command: ["api", "8000"]
  expose:
    - "8000"
  depends_on:
    migrate:
      condition: service_completed_successfully
    haproxy:
      condition: service_healthy
    valkey:
      condition: service_started
    kafka:
      condition: service_started
  networks:
    - infra

services:
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
    restart: "no"
    environment:
      DB_MASTER_HOST: haproxy
    env_file:
      - ../dev.env
    command: ["init"]
    depends_on:
      pg-ready:
        condition: service_completed_successfully
    networks:
      - infra

  pg-ready:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGPASSWORD: app_pswd
    depends_on:
      haproxy:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        echo "Waiting for PostgreSQL master via HAProxy..."
        for i in $$(seq 1 60); do
          if pg_isready -h haproxy -p 5432 -U postgres -d app_db >/dev/null 2>&1; then
            echo "PostgreSQL master is ready"
            exit 0
          fi
          sleep 2
        done
        echo "PostgreSQL master is not ready"
        exit 1
    networks:
      - infra

  app:
    <<: *app-common

  nginx:
    image: nginx:1.27-alpine
    hostname: nginx
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - infra
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/livez"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  patroni1:
    <<: *patroni-common
    container_name: patroni1
    volumes:
      - ./patroni/patroni1.yaml:/etc/patroni.yml:ro
      - pgdata1:/var/lib/postgresql:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/master >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  patroni2:
    <<: *patroni-common
    container_name: patroni2
    volumes:
      - ./patroni/patroni2.yaml:/etc/patroni.yml:ro
      - pgdata2:/var/lib/postgresql:rw
    depends_on:
      patroni1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/replica >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 60s

  patroni3:
    <<: *patroni-common
    container_name: patroni3
    volumes:
      - ./patroni/patroni3.yaml:/etc/patroni.yml:ro
      - pgdata3:/var/lib/postgresql:rw
    depends_on:
      patroni1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/replica >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 60s

  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    hostname: etcd
    container_name: etcd
    networks:
      - infra
    environment:
      ETCD_NAME: etcd
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: patroni
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  haproxy:
    image: haproxy:2.9-alpine
    hostname: haproxy
    container_name: haproxy
    ports:
      - "5432:5432"
      - "5433:5433"
      - "8404:8404"
    networks:
      - infra
    volumes:
      - ./patroni/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      patroni1:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles:
      - loadtest
    networks:
      - infra
    ports:
      - "5665:5665"
    volumes:
      - ./scripts:/scripts
      - ./k6_reports:/reports
    environment:
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_EXPORT=/reports/html-report.html

  valkey:
    image: dhi.io/valkey:9
    container_name: redis
    networks:
      - infra
    ports:
      - "6379:6379"
    command: ["valkey-server", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]

  kafka:
    image: dhi.io/kafka:4.1-native
    container_name: kafka
    networks:
      - infra
    ports:
      - "9092:9092"
    expose:
      - "9093"
    environment:
      KAFKA_ENABLE_KRAFT: yes
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_NUM_PARTITIONS: 50
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    profiles:
      - debug
    networks:
      - infra
    ports:
      - "8082:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: true
      KAFKA_CLUSTERS_0_NAME: kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093

networks:
  infra:
    name: infra

volumes:
  kafka_data:
  pgdata1:
  pgdata2:
  pgdata3:
