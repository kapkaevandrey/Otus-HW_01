user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide nginx version in Server header and error pages
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Docker embedded DNS — required for dynamic upstream when `app` is scaled
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Lab load-test friendly limits (k6 from one container can exceed 1000 r/s)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5000r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream app_backend {
        zone app_backend 64k;
        least_conn;
        server app:8000 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Safe defaults for HTTP-only lab setup (no HSTS without HTTPS)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        limit_req zone=api_limit burst=10000 nodelay;
        limit_conn conn_limit 5000;

        # Block dotfiles and accidental exposure of hidden paths
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location = /livez {
            access_log off;
            proxy_pass http://app_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # WebSocket feed — longer timeouts, sticky upgrade headers
        location /post/ {
            proxy_pass http://app_backend;
            include /etc/nginx/proxy_params.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://app_backend;
            include /etc/nginx/proxy_params.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Fail over to another app instance on backend errors
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
