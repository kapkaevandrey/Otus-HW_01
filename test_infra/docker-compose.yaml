x-patroni-common: &patroni-common
  build:
    context: .
    dockerfile: ./patroni/Dockerfile.patroni
  networks:
    - infra
  environment:
    PATRONI_SCOPE: app_cluster
    PATRONI_NAME: ${PATRONI_NAME}
    PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
    PATRONI_POSTGRESQL_CONNECT_ADDRESS: ${PATRONI_NAME}:5432
    PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
    PATRONI_RESTAPI_CONNECT_ADDRESS: ${PATRONI_NAME}:8008
    PATRONI_ETCD_HOST: etcd:2379
    POSTGRES_PASSWORD: app_pswd
    POSTGRES_DB: app_db
  command: patroni /etc/patroni.yml
  depends_on:
    - etcd


services:
  app:
    container_name: app
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
    restart: always
    environment:
      ALLOW_ORIGINS: "http://localhost:3030,http://0.0.0.0:3030,http://0.0.0.0:8000"
      DB_MASTER_HOST: haproxy
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    env_file:
      - ../dev.env
    command:
      ["start", "8000"]
    depends_on:
      haproxy:
        condition: service_healthy
      valkey:
        condition: service_started
      redis-script-loader:
        condition: service_completed_successfully
    networks:
      - infra

  patroni1:
    <<: *patroni-common
    container_name: patroni1
    environment:
      PATRONI_NAME: patroni1
    volumes:
      - ./patroni/patroni1.yaml:/etc/patroni.yml
      - pgdata1:/var/lib/postgresql:rw

  patroni2:
    <<: *patroni-common
    container_name: patroni2
    environment:
      PATRONI_NAME: patroni2
    volumes:
      - ./patroni/patroni2.yaml:/etc/patroni.yml:ro
      - pgdata2:/var/lib/postgresql:rw
    depends_on:
      patroni1:
        condition: service_started

  patroni3:
    <<: *patroni-common
    container_name: patroni3
    environment:
      PATRONI_NAME: patroni3
    volumes:
      - ./patroni/patroni3.yaml:/etc/patroni.yml:ro
      - pgdata3:/var/lib/postgresql:rw
    depends_on:
      patroni1:
        condition: service_started

  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    hostname: etcd
    container_name: etcd
    networks:
      - infra
    environment:
      ETCD_NAME: etcd
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: patroni
    healthcheck:
      test: ["CMD-SHELL", "etcdctl endpoint health --endpoints=http://localhost:2379"]
      interval: 10s
      timeout: 5s
      retries: 5

  haproxy:
    image: haproxy:2.9-alpine
    hostname: haproxy
    container_name: haproxy
    ports:
      - "5432:5432"
    networks:
      - infra
    volumes:
      - ./patroni/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: [ "CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg" ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      patroni1:
        condition: service_started
      patroni2:
        condition: service_started
      patroni3:
        condition: service_started

  k6:
    image: grafana/k6:latest
    container_name: k6
    networks:
      - infra
    ports:
      - "5665:5665"
    volumes:
      - ./scripts:/scripts
      - ./k6_reports:/reports
    environment:
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_EXPORT=/reports/html-report.html

  valkey:
    image: dhi.io/valkey:9
    container_name: redis
    networks:
      - infra
    ports:
      - "6379:6379"
    command: ["valkey-server", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]

  redis-script-loader:
    image: dhi.io/valkey:9
    restart: "no"
    networks:
      - infra
    depends_on:
      valkey:
        condition: service_started
    volumes:
      - ../app/scripts/redis:/lua/redis:ro
    command:
      - /bin/sh
      - -ec
      - |
        echo "Loading Redis Lua scripts..."
        for f in /lua/redis/*.lua; do
          valkey-cli -h redis SCRIPT LOAD "$$(cat "$$f")" >/dev/null
          echo "Loaded $$f"
        done
        echo "Redis Lua scripts loaded."

  kafka:
    image: dhi.io/kafka:4.1-native
    container_name: kafka
    networks:
      - infra
    ports:
      - "9092:9092"
    expose:
      - "9093"
    environment:
      KAFKA_ENABLE_KRAFT: yes
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_NUM_PARTITIONS: 50
    volumes:
      - kafka_data:/var/lib/kafka/data
      - /var/run/docker.sock:/var/run/docker.sock

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    networks:
      - infra
    ports:
      - "8082:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: true
      KAFKA_CLUSTERS_0_NAME: kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093

networks:
  infra:
    name: infra

volumes:
  kafka_data:
  pgdata1:
  pgdata2:
  pgdata3:
